[PATHS]
; 各目录的文件夹名称，程序会自动在当前工作目录下查找这些文件夹
templatedir = 1_template
capturedir = 2_capture
resultdir = 3_result
testdir = 4_test_data

[MATCHING]
; 模板匹配相关参数，影响功能1中模板图与实拍图的对齐精度
; scale: 粗匹配时的缩放比例，越小匹配越快但精度越低 (建议 0.3~0.7)
scale = 0.5
; marginratio: 精匹配时的搜索边距比例，基于模板尺寸 (建议 0.15~0.35)
marginratio = 0.25
; matchscore: 匹配成功最低得分阈值，低于此值会判定为匹配失败 (建议 0.5~0.8)
matchscore = 0.6

[GRID]
; 色卡网格的行列数量，必须与模板图的实际色块排列一致
rownum = 49
colnum = 33

[DEBUG]
; 调试图像与采样参数
; patchradius: 提取每个色块均值时的采样半径（像素），越大采样区域越大 (建议 15~40)
patchradius = 30
; showdebugimages: 是否在结果目录中保存调试图像（网格中心点定位图）
showdebugimages = True

[COLOR]
; 颜色校正强度参数，修改后需重新运行【功能1】生成LUT才能生效
;
; linear_gain: 整体亮度缩放。先对图像整体亮度进行缩放，再进入后续 Gamma 调整。
;              <1.0: 压暗整体，给高光留余量，防止后续调整过曝死白。
;              =1.0: 保持原亮度。
;              >1.0: 提亮整体，画面整体变白，但高光容易死白。
;              调参口诀：画面偏暗想提亮 → 调大；高光过曝想压暗 → 调小。
;              推荐范围: 0.80 ~ 0.95
linear_gain = 0.95


; highlight_contrast: Gamma 曲线系数，控制整体明暗和对比度（不只是高光）。
;                     数值越大：整体越暗，暗部压缩越多，对比度越低。
;                     数值越小：整体越亮，暗部被拉起，对比度越高。
;                     =1.0: 线性，保持 linear_gain 后的亮度关系。
;                     调参口诀：画面偏黑/对比度过低 → 调小；画面偏白/对比度过高 → 调大。
;                     推荐范围: 0.8 ~ 1.5
highlight_contrast = 1.1


; saturation_gain: 饱和度增益，1.0 表示不调整。
;                  数值越大颜色越鲜艳；数值越小颜色越灰。
;                  推荐范围: 1.0 ~ 1.5
saturation_gain = 1.0
